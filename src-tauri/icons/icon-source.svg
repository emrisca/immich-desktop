<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Source art for every icon in this folder. Run
       `npx tauri icon src-tauri/icons/icon-source.svg` after editing it.

       One gradient square, no tile and no border: it fills the canvas, so
       Windows and macOS draw the rounded corners themselves. Colours are
       sampled from the 24px original, which ran #b9bcf7 through #68bcdf to
       #3ad8cd. The 20% corner radius is the one that original showed. -->
  <defs>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b6aaf8" />
      <stop offset="0.34" stop-color="#93a8f0" />
      <stop offset="0.62" stop-color="#62bcdf" />
      <stop offset="1" stop-color="#3ad8cd" />
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" rx="214" fill="url(#mark)" />
  <rect x="4" y="4" width="1016" height="1016" rx="211" fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="8" />
</svg>
